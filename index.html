<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Онлайн-запись</title>
<meta name="theme-color" content="#8A1F4B">
<meta name="description" content="Онлайн-запись на маникюр и педикюр">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Запись">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top wrap" id="top"></header>
  <main id="main" class="wrap">
    <div class="loading" role="status"><span class="spinner" aria-hidden="true"></span>Загрузка…</div>
  </main>
  <div class="bar"><div class="inner" id="bar"></div></div>
  <div id="overlay"></div>
</div>
<script type="module" src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    // Updates: check for a new version on start and whenever the app is brought back to the screen,
    // then reload once so the installed phone app never stays on an old version.
    var hadController = !!navigator.serviceWorker.controller, reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if (!hadController || reloading) { hadController = true; return; }
      var typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
      if (typing) return;   // don't interrupt someone filling in a form; the next start will pick it up
      reloading = true; location.reload();
    });
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function(reg){
        reg.update().catch(function(){});
        document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") reg.update().catch(function(){}); });
      }).catch(function(){});
    });
  }
</script>
</body>
</html>
